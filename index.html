<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فلوچارت عیب‌یابی: چرا کاری را انجام نمی‌دهم؟</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* General Body and Layout Styles */
        body {
            font-family: 'Vazirmatn', sans-serif;
            background-color: #f1f5f9; /* bg-slate-100 */
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1rem; /* p-4 */
            margin: 0;
        }

        /* Card Container Style */
        .card {
            background-color: white;
            border-radius: 1rem;
            padding: 2rem;
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
            transition: all 0.3s ease-in-out;
            max-width: 500px;
            width: 90%;
            text-align: center;
        }

        /* Button Styles */
        .btn {
            border-radius: 0.5rem;
            padding: 0.75rem 1.5rem;
            font-weight: 700;
            transition: all 0.2s ease;
            cursor: pointer;
            border: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .btn-yes { background-color: #22c55e; color: white; }
        .btn-yes:hover { background-color: #16a34a; }
        .btn-no { background-color: #ef4444; color: white; }
        .btn-no:hover { background-color: #dc2626; }
        .btn-restart { background-color: #3b82f6; color: white; }
        .btn-restart:hover { background-color: #2563eb; }
        
        /* Button Group Layout */
        .button-group {
            display: flex;
            justify-content: center;
            gap: 1rem; /* gap-4 */
        }

        /* Result Card Styles */
        .result-card { 
            border-right: 5px solid; 
            padding-right: 1rem; 
            background-color: #f8fafc; /* slate-50 */
            margin-bottom: 1rem;
            padding-top: 1rem;
            padding-bottom: 1rem;
            text-align: right;
        }
        .diagnosis { border-color: #f97316; /* orange-500 */ }
        .solution { border-color: #22c55e; /* green-500 */ }
        .solution ul {
            list-style-type: disc;
            padding-right: 1.5rem;
            margin-top: 0.5rem;
        }

        /* Typography Styles */
        .question-title {
            font-size: 1.5rem; /* text-2xl */
            line-height: 2rem;
            font-weight: 700; /* font-bold */
            margin-bottom: 1.5rem; /* mb-6 */
            color: #1e293b; /* text-slate-800 */
        }
        .result-title {
            font-size: 1.125rem; /* text-lg */
            line-height: 1.75rem;
            font-weight: 700; /* font-bold */
            margin-bottom: 0.5rem; /* mb-2 */
        }
        .diagnosis .result-title { color: #c2410c; /* text-orange-700 */ }
        .solution .result-title { color: #15803d; /* text-green-700 */ }
        .result-text, .result-text p, .result-text ul {
            color: #334155; /* text-slate-700 */
        }
        .result-text > *:not(:last-child) {
            margin-bottom: 0.5rem; /* space-y-2 */
        }

        /* Spacing utilities */
        .result-container > *:not(:last-child) {
            margin-bottom: 1rem; /* space-y-4 */
        }
        .restart-container {
            padding-top: 1rem; /* pt-4 */
            text-align: center;
        }

    </style>
</head>
<body>

    <div id="flowchart-container" class="card">
        <!-- Content will be injected by JavaScript -->
    </div>

    <script>
        // --- DATA STRUCTURE FOR THE FLOWCHART ---
        const flowchart = {
            start: { type: 'question', text: 'آیا تعریف تسک از نظر خودم واضح و شفاف است؟', yes: 'q_energy', no: 'r_unclear_task' },
            r_unclear_task: { 
                type: 'result', 
                diagnosis: 'تشخیص: تعریف نامشخص یا بزرگی بیش از حد تسک.', 
                solution: `
                    <strong>راهکار: تکنیک شکستن کار</strong>
                    <ul>
                        <li>یک کاغذ و قلم بردارید. عنوان اصلی تسک را بالا بنویسید.</li>
                        <li>هر مرحله‌ای که برای انجام آن به ذهنتان می‌رسد را لیست کنید.</li>
                        <li>سعی کنید مراحل را آنقدر کوچک کنید که هر کدام کمتر از ۲۵ دقیقه زمان ببرد.</li>
                        <li><strong>فقط روی اولین قدم تمرکز کنید و آن را انجام دهید.</strong></li>
                    </ul>
                `
            },
            q_energy: { type: 'question', text: 'آیا از نظر فیزیکی و ذهنی انرژی کافی دارم؟ (خسته، گرسنه یا درگیر استرس نیستم؟)', yes: 'q_boring', no: 'r_no_energy' },
            r_no_energy: { 
                type: 'result', 
                diagnosis: 'تشخیص: تخلیه انرژی یا خستگی ذهنی.', 
                solution: `
                    <strong>راهکار: اولویت‌بندی نیازهای اساسی</strong>
                    <p>بدن و ذهن شما برای کار کردن به سوخت نیاز دارند. قبل از هرچیز، یک نیاز اساسی خود را برطرف کنید: یک چرت کوتاه بزنید، یک وعده غذای سالم بخورید، یا چند دقیقه قدم بزنید و نفس عمیق بکشید.</p>
                ` 
            },
            q_boring: { type: 'question', text: 'آیا این کار به نظرم کسل‌کننده و بی‌اهمیت می‌آید؟', yes: 'r_disconnected', no: 'q_fear' },
            r_disconnected: { 
                type: 'result', 
                diagnosis: 'تشخیص: قطع ارتباط تسک با «چرایی» و مأموریت اصلی.', 
                solution: `
                    <strong>راهکار: تکنیک یافتن چرایی</strong>
                    <p>از خودتان این دو سوال را بپرسید و جواب‌ها را بنویسید:</p>
                    <ul>
                        <li>انجام این کار چه تأثیر مثبتی (حتی کوچک) روی زندگی من یا دیگران دارد؟</li>
                        <li>اگر این کار را انجام دهم، به کدام هدف بزرگ‌ترم نزدیک‌تر می‌شوم؟</li>
                    </ul>
                `
            },
            q_fear: { type: 'question', text: 'آیا ترس از شکست، تأییدطلبی یا کمال‌گرایی، مانع شروع من شده است؟', yes: 'r_mental_block', no: 'q_distractions' },
            r_mental_block: { 
                type: 'result', 
                diagnosis: 'تشخیص: بلوک ذهنی ناشی از ترس یا کمال‌گرایی.', 
                solution: `
                    <strong>راهکار: قانون ۲ دقیقه</strong>
                    <ul>
                        <li>به خودتان قول بدهید که فقط برای <strong>۲ دقیقه</strong> روی این کار تمرکز می‌کنید.</li>
                        <li>یک تایمر تنظیم کنید و کار را شروع کنید.</li>
                        <li>بعد از ۲ دقیقه، آزاد هستید که متوقف شوید.</li>
                        <li>هدف، عالی انجام دادن نیست، بلکه فقط و فقط <strong>شروع کردن</strong> است.</li>
                    </ul>
                `
            },
            q_distractions: { type: 'question', text: 'آیا محیط اطرافم پر از عوامل حواس‌پرتی است؟ (مثل گوشی، سروصدا)', yes: 'r_bad_env', no: 'r_combo' },
            r_bad_env: { 
                type: 'result', 
                diagnosis: 'تشخیص: محیط نامناسب و پر از مانع.', 
                solution: `
                    <strong>راهکار: مهندسی محیط</strong>
                    <p>یک تغییر فیزیکی کوچک برای حذف بزرگترین عامل حواس‌پرتی ایجاد کنید:</p>
                    <ul>
                        <li>گوشی خود را در اتاق دیگری بگذارید.</li>
                        <li>از هدفون‌های نویز-کنسلینگ استفاده کنید.</li>
                        <li>تمام تب‌های غیرضروری مرورگر را ببندید.</li>
                    </ul>
                `
            },
            r_combo: { 
                type: 'result', 
                diagnosis: 'تشخیص: ترکیبی از موارد بالا یا مشکلی عمیق‌تر.', 
                solution: `
                    <strong>راهکار: گفتگو و بازبینی</strong>
                    <p>گاهی اوقات بهترین راه حل، صحبت کردن است. موضوع را با یک دوست، همکار یا عضو خانواده که به او اعتماد دارید در میان بگذارید. گاهی بیان کردن مشکل با صدای بلند، خودش نیمی از راه حل است.</p>
                `
            }
        };

        // --- APPLICATION LOGIC ---
        const container = document.getElementById('flowchart-container');
        let currentNodeKey = 'start';

        function renderNode(nodeKey) {
            const node = flowchart[nodeKey];
            let html = '';

            if (node.type === 'question') {
                html = `
                    <h2 class="question-title">${node.text}</h2>
                    <div class="button-group">
                        <button class="btn btn-yes" onclick="handleAnswer('yes')">بله</button>
                        <button class="btn btn-no" onclick="handleAnswer('no')">خیر</button>
                    </div>
                `;
            } else if (node.type === 'result') {
                html = `
                    <div class="result-container">
                        <div>
                            <div class="result-card diagnosis">
                                <h3 class="result-title">تشخیص مشکل:</h3>
                                <p class="result-text">${node.diagnosis}</p>
                            </div>
                            <div class="result-card solution">
                                <h3 class="result-title">راهکار عملی:</h3>
                                <div class="result-text">${node.solution}</div>
                            </div>
                        </div>
                        <div class="restart-container">
                            <button class="btn btn-restart" onclick="restart()">شروع مجدد</button>
                        </div>
                    </div>
                `;
            }
            container.innerHTML = html;
        }

        function handleAnswer(answer) {
            const currentNode = flowchart[currentNodeKey];
            const nextNodeKey = currentNode[answer];
            if (nextNodeKey) {
                currentNodeKey = nextNodeKey;
                renderNode(currentNodeKey);
            }
        }

        function restart() {
            currentNodeKey = 'start';
            renderNode(currentNodeKey);
        }

        // Initial render when the page loads
        window.onload = () => renderNode(currentNodeKey);
    </script>
</body>
</html>
